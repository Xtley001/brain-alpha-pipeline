name: BRAIN 50-Alpha Autonomous Reserve Producer

on:
  workflow_dispatch:
  schedule:
    # Hourly fallback pulse to ensure pipeline keeps running 24/7 in the cloud
    - cron: "0 * * * *"

concurrency:
  group: brain-reserve-producer
  cancel-in-progress: false

jobs:
  produce_reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      ENABLE_AUTO_SUBMIT: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 50-Alpha Decorrelated Reserve Pipeline
        timeout-minutes: 160
        run: python -u scripts/generate_50_reserve_alphas.py

      - name: Auto-chain next run if reserve target not reached
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(python -c "import psycopg, os; conn=psycopg.connect(os.getenv('DATABASE_URL')); cur=conn.cursor(); cur.execute(\"SELECT count(*) FROM options_alphas WHERE status='QUALIFIED'\"); print(cur.fetchone()[0])" || echo "0")
          echo "Current qualified count: $COUNT / 50"
          if [ "$COUNT" -lt 50 ]; then
            echo "Reserve has $COUNT / 50 alphas. Auto-chaining next run in cloud..."
            sleep 30
            gh workflow run reserve_50.yml --ref main || true
          else
            echo "Reserve complete! 50 alphas achieved."
          fi
