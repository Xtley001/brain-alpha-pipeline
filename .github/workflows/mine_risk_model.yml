name: Cloud Miner - Risk Model (model51/52)

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of candidates to evaluate"
        required: false
        default: "9999"
      timeout_mins:
        description: "Timeout budget in minutes"
        required: false
        default: "115"
      concurrency:
        description: "Concurrent simulation slots"
        required: false
        default: "3"
  schedule:
    # Staggered 2h relay: fires at 03:00, 09:00, 15:00, 21:00 UTC
    - cron: "0 3,9,15,21 * * *"

concurrency:
  group: cloud-miner-risk-model
  cancel-in-progress: true

jobs:
  mine-risk-model:
    name: Mine Risk Model Alphas (3-Slot High-Speed Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 125

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAIN_MAX_CONCURRENT_SIMS: "3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Cloud Risk Model Miner
        run: |
          python scripts/cloud_multi_miner.py \
            --category risk_model \
            --candidates ${{ github.event.inputs.candidates || '9999' }} \
            --timeout-mins ${{ github.event.inputs.timeout_mins || '115' }} \
            --concurrency ${{ github.event.inputs.concurrency || '3' }}
