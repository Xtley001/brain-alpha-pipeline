name: BRAIN Daily Alpha Drip Submitter

on:
  schedule:
    # 5 checks daily (UTC) on the dot: 05:00, 09:00, 13:00, 17:00, 21:00
    # Spaced exactly 4 hours apart to respect BRAIN's submission window
    - cron: "0 5,9,13,17,21 * * *"
  workflow_dispatch: {}  # Allows manual 1-click trigger anytime

concurrency:
  group: brain-drip-submitter
  cancel-in-progress: false

jobs:
  drip:
    if: github.repository_owner == 'Xtley001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ENABLE_AUTO_SUBMIT: "true"
      DRIP_MAX_DAILY: "3"
      DRIP_MIN_INTERVAL_HOURS: "4.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Daily Drip Alpha Submission
        run: python -m brain_options.run --drip
