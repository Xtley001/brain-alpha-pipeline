name: Decorrelation Blitz (Primary Org Xtley001)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of top-CQS correlated base alphas to salvage (e.g. 50)"
        required: false
        default: "50"

concurrency:
  group: brain-decorrelate-blitz
  cancel-in-progress: false

jobs:
  blitz:
    if: github.repository_owner == 'Xtley001'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAIN_MAX_CONCURRENT_SIMS: "3"
      RUN_TIME_BUDGET_SECONDS: "18000"
      STAGE0_MIN_FITNESS: "0.20"
      STAGE0_MIN_SHARPE: "0.35"
      FILTER_MIN_SHARPE: "1.25"
      FILTER_MIN_FITNESS: "1.00"
      FILTER_MAX_TURNOVER: "0.70"
      FILTER_MIN_TURNOVER: "0.01"
      ENABLE_AUTO_SUBMIT: "true"
      UNIVERSE: "TOP3000"
      DELAY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Decorrelation Blitz
        run: python -m brain_options.run --decorrelate --limit ${{ github.event.inputs.limit || '50' }}
