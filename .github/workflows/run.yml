name: BRAIN Options Alpha Discovery (Auto Staggered)

on:
  schedule:
    # 48 runs/day across 4 worker orgs (1 run every 30 minutes, 24/7):
    # Org 1 (xtley-alpha-research-01): even hours at :00 (12 runs/day)
    - cron: "0 */2 * * *"
    # Org 2 (xtley-alpha-research-02): even hours at :30 (12 runs/day)
    - cron: "30 */2 * * *"
    # Org 3 (xtley-alpha-research-03): odd hours at :00 (12 runs/day)
    - cron: "0 1-23/2 * * *"
    # Org 4 (xtley-alpha-research-04): odd hours at :30 (12 runs/day)
    - cron: "30 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of candidates to evaluate in this batch"
        required: false
        default: "20"
      archetype:
        description: "Archetype specialization override (e.g. breakeven, skew, term_structure, forward_basis,pcr_flow)"
        required: false
        default: ""

concurrency:
  group: brain-discovery-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  discovery:
    if: |
      github.repository_owner != 'Xtley001' && (
        github.event_name == 'workflow_dispatch' ||
        (github.repository_owner == 'xtley-alpha-research-01' && github.event.schedule == '0 */2 * * *') ||
        (github.repository_owner == 'xtley-alpha-research-02' && github.event.schedule == '30 */2 * * *') ||
        (github.repository_owner == 'xtley-alpha-research-03' && github.event.schedule == '0 1-23/2 * * *') ||
        (github.repository_owner == 'xtley-alpha-research-04' && github.event.schedule == '30 1-23/2 * * *')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAIN_MAX_CONCURRENT_SIMS: "3"
      MAX_CANDIDATES_PER_RUN: ${{ github.event.inputs.candidates || '20' }}
      RUN_TIME_BUDGET_SECONDS: "820"
      STAGE0_MIN_FITNESS: "0.20"
      STAGE0_MIN_SHARPE: "0.35"
      FILTER_MIN_SHARPE: "1.25"
      FILTER_MIN_FITNESS: "1.00"
      FILTER_MAX_TURNOVER: "0.70"
      FILTER_MIN_TURNOVER: "0.01"
      ENABLE_AUTO_SUBMIT: "false"
      UNIVERSE: "TOP3000"
      DELAY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Archetype Specialization
        run: |
          INPUT_ARCH="${{ github.event.inputs.archetype }}"
          OWNER="${{ github.repository_owner }}"
          if [ -n "$INPUT_ARCH" ]; then
            TARGET_ARCH="$INPUT_ARCH"
          elif [ "$OWNER" = "xtley-alpha-research-01" ]; then
            TARGET_ARCH="breakeven"
          elif [ "$OWNER" = "xtley-alpha-research-02" ]; then
            TARGET_ARCH="skew"
          elif [ "$OWNER" = "xtley-alpha-research-03" ]; then
            TARGET_ARCH="term_structure"
          elif [ "$OWNER" = "xtley-alpha-research-04" ]; then
            TARGET_ARCH="forward_basis,pcr_flow"
          else
            TARGET_ARCH=""
          fi
          echo "ARCHETYPE=$TARGET_ARCH" >> $GITHUB_ENV
          echo "Resolved divide-and-conquer specialization for $OWNER: $TARGET_ARCH"

      - name: Re-optimize Stage 0 passed candidates
        run: python -m brain_options.run --retry-stage0 --limit 10

      - name: Generate and evaluate specialized candidates
        run: python -m brain_options.run --single-batch

      - name: Commit and push updated candidate history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f brain_options/data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): record evaluated candidates [skip ci]"
            git pull --rebase -X ours origin main || (git rebase --abort && echo "Rebase aborted") || true
            git push origin main || echo "Git push skipped or failed"
          else
            echo "No data changes to commit."
          fi
