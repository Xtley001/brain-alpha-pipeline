name: BRAIN Alpha Discovery (Single Public Org - Xtley001)

on:
  schedule:
    # 48 discovery runs/day (1 run every 30 minutes, 24/7 on Xtley001 public runner):
    # Slot 1: Even hours at :07 -> TOP1000 (Term Structure & Skew)
    - cron: "7 */2 * * *"
    # Slot 2: Even hours at :37 -> TOP2000 (PCR Flow & Forward Basis)
    - cron: "37 */2 * * *"
    # Slot 3: Odd hours at :07 -> TOP500 (Call Breakeven & Short Interest)
    - cron: "7 1-23/2 * * *"
    # Slot 4: Odd hours at :37 -> TOPSP500 (Hybrid Confluence & Analyst Revisions)
    - cron: "37 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of candidates to evaluate in this batch"
        required: false
        default: "40"
      strategy:
        description: "Strategy module override (all, term_structure, skew, pcr_flow, breakeven, forward_basis, short_interest, analyst_revisions, hybrid_confluence, supply_chain, accruals_cashflow, informed_short_demand, extreme_tail_risk, iv_lead_lag, network_momentum, formulaic_101)"
        required: false
        default: ""
      universe:
        description: "Universe override (TOP3000, TOP2000, TOP1000, TOP500, TOP200, TOPSP500)"
        required: false
        default: ""
      neutralization:
        description: "Neutralization override (SUBINDUSTRY, INDUSTRY, SECTOR, MARKET, NONE)"
        required: false
        default: ""

concurrency:
  group: brain-discovery-cluster
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAIN_MAX_CONCURRENT_SIMS: "3"
      MAX_CANDIDATES_PER_RUN: ${{ github.event.inputs.candidates || '40' }}
      RUN_TIME_BUDGET_SECONDS: "900"
      STAGE0_MIN_FITNESS: "0.20"
      STAGE0_MIN_SHARPE: "0.35"
      FILTER_MIN_SHARPE: "1.25"
      FILTER_MIN_FITNESS: "1.00"
      FILTER_MAX_TURNOVER: "0.70"
      FILTER_MIN_TURNOVER: "0.01"
      ENABLE_AUTO_SUBMIT: "true"
      DELAY: "1"
      NOTIFY_EVERY_BATCH: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Multiverse Strategy, Universe & Neutralization
        run: |
          INPUT_STRAT="${{ github.event.inputs.strategy }}"
          INPUT_UNIV="${{ github.event.inputs.universe }}"
          INPUT_NEUT="${{ github.event.inputs.neutralization }}"
          HOUR=$(date -u +"%H")
          MIN=$(date -u +"%M")

          # 1. Resolve Strategy & Universe schedule rotation (Cycling 15 strategies across 4 slots)
          if [ -n "$INPUT_STRAT" ]; then
            TARGET_STRAT="$INPUT_STRAT"
          elif [ $((HOUR % 2)) -eq 0 ] && [ "$MIN" -lt 30 ]; then
            TARGET_STRAT="term_structure,skew,extreme_tail_risk,iv_lead_lag"
          elif [ $((HOUR % 2)) -eq 0 ] && [ "$MIN" -ge 30 ]; then
            TARGET_STRAT="pcr_flow,forward_basis,formulaic_101"
          elif [ $((HOUR % 2)) -ne 0 ] && [ "$MIN" -lt 30 ]; then
            TARGET_STRAT="breakeven,short_interest,informed_short_demand"
          else
            TARGET_STRAT="hybrid_confluence,analyst_revisions,accruals_cashflow,supply_chain,network_momentum"
          fi

          if [ -n "$INPUT_UNIV" ]; then
            TARGET_UNIV="$INPUT_UNIV"
          elif [ $((HOUR % 2)) -eq 0 ] && [ "$MIN" -lt 30 ]; then
            TARGET_UNIV="TOP1000"
          elif [ $((HOUR % 2)) -eq 0 ] && [ "$MIN" -ge 30 ]; then
            TARGET_UNIV="TOP2000"
          elif [ $((HOUR % 2)) -ne 0 ] && [ "$MIN" -lt 30 ]; then
            TARGET_UNIV="TOP500"
          else
            TARGET_UNIV="TOPSP500"
          fi

          echo "STRATEGY=$TARGET_STRAT" >> $GITHUB_ENV
          echo "ARCHETYPE=$TARGET_STRAT" >> $GITHUB_ENV
          echo "UNIVERSE=$TARGET_UNIV" >> $GITHUB_ENV
          if [ -n "$INPUT_NEUT" ]; then
            echo "NEUTRALIZATION=$INPUT_NEUT" >> $GITHUB_ENV
          fi
          echo "Resolved Single-Org Execution: Strategy=$TARGET_STRAT, Universe=$TARGET_UNIV"

      - name: Salvage high-Sharpe correlated alphas
        run: python -m brain_options.run --decorrelate --limit 1 || true

      - name: Re-optimize Stage 0 passed candidates
        run: python -m brain_options.run --retry-stage0 --limit 1 || true

      - name: Generate and evaluate specialized candidates
        run: python -m brain_options.run --single-batch --candidates ${{ env.MAX_CANDIDATES_PER_RUN }} --strategy "$STRATEGY"
