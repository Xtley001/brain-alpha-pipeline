name: BRAIN Alpha Discovery (4-Worker Cloud Matrix)

on:
  schedule:
    # Periodic fallback trigger every 30 minutes in case of dropped runner chain
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of candidates to evaluate in this batch (per worker)"
        required: false
        default: "80"
      strategy:
        description: "Strategy module override (optional)"
        required: false
        default: ""
      universe:
        description: "Universe override (optional)"
        required: false
        default: ""
      neutralization:
        description: "Neutralization override (optional)"
        required: false
        default: ""

concurrency:
  group: brain-alpha-matrix
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1, 2, 3]
    permissions:
      contents: read
      actions: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAIN_MAX_CONCURRENT_SIMS: "3"
      MAX_CANDIDATES_PER_RUN: ${{ github.event.inputs.candidates || '80' }}
      RUN_TIME_BUDGET_SECONDS: "1200"
      STAGE0_MIN_FITNESS: "0.30"
      STAGE0_MIN_SHARPE: "0.60"
      FILTER_MIN_SHARPE: "1.25"
      FILTER_MIN_FITNESS: "1.00"
      FILTER_MAX_TURNOVER: "0.70"
      FILTER_MIN_TURNOVER: "0.01"
      ENABLE_AUTO_SUBMIT: "true"
      DELAY: "1"
      NOTIFY_EVERY_BATCH: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Multiverse Strategy, Universe & Neutralization
        run: |
          INPUT_STRAT="${{ github.event.inputs.strategy }}"
          INPUT_UNIV="${{ github.event.inputs.universe }}"
          INPUT_NEUT="${{ github.event.inputs.neutralization }}"
          INPUT_CAND="${{ github.event.inputs.candidates }}"
          SLOT_IDX=${{ matrix.slot }}
          HOUR=$(date -u +"%H")
          CYCLE_6=$(( (10#$HOUR / 2) % 6 ))

          # 1. Resolve Strategy schedule rotation (30 Orthogonal Institutional Strategies across 4 slots)
          if [ -n "$INPUT_STRAT" ]; then
            TARGET_STRAT="$INPUT_STRAT"
          elif [ $SLOT_IDX -eq 0 ]; then
            TARGET_STRAT="term_structure,extreme_tail_risk,jump_variance_moments,iv_lead_lag,macro_fomc_cpi_drift,realized_jump_intensity"
          elif [ $SLOT_IDX -eq 1 ]; then
            TARGET_STRAT="forward_basis,pcr_flow,peavd_earnings_vol_drift,peavrp_volatility_premia,gamma_pinning_clustering,formulaic_101"
          elif [ $SLOT_IDX -eq 2 ]; then
            TARGET_STRAT="analyst_revisions,accruals_cashflow,institutional_13f_breadth,informed_short_demand,short_interest,order_flow_vpin,capex_asset_growth"
          else
            TARGET_STRAT="insider_cluster_buying,supply_chain,patent_innovation_efficiency,network_momentum,hybrid_confluence,dynamic_short_squeeze,customer_supplier_cascades,distance_to_default_debt,rd_capitalization_spillovers"
          fi

          # 2. Resolve 6-Universe Cyclic Shift (TOP3000, TOP2000, TOP1000, TOP500, TOP200, TOPSP500)
          UNIVERSES=("TOP3000" "TOP2000" "TOP1000" "TOP500" "TOP200" "TOPSP500")
          UNIV_IDX=$(( (SLOT_IDX + CYCLE_6) % 6 ))

          if [ -n "$INPUT_UNIV" ]; then
            TARGET_UNIV="$INPUT_UNIV"
          else
            TARGET_UNIV="${UNIVERSES[$UNIV_IDX]}"
          fi

          # 3. Resolve Candidate Batch Size (Balanced 100 candidates per worker = 400 per matrix cycle)
          if [ -n "$INPUT_CAND" ]; then
            TARGET_CAND="$INPUT_CAND"
          else
            TARGET_CAND="100"
          fi

          echo "STRATEGY=$TARGET_STRAT" >> $GITHUB_ENV
          echo "ARCHETYPE=$TARGET_STRAT" >> $GITHUB_ENV
          echo "UNIVERSE=$TARGET_UNIV" >> $GITHUB_ENV
          echo "SLOT_IDX=$SLOT_IDX" >> $GITHUB_ENV
          echo "CANDIDATES_COUNT=$TARGET_CAND" >> $GITHUB_ENV
          if [ -n "$INPUT_NEUT" ]; then
            echo "NEUTRALIZATION=$INPUT_NEUT" >> $GITHUB_ENV
          fi
          echo "Resolved Matrix Worker $SLOT_IDX: Strategy=$TARGET_STRAT, Universe=$TARGET_UNIV, Candidates=$TARGET_CAND"

      - name: Re-optimize Stage 0 passed candidates
        continue-on-error: true
        timeout-minutes: 5
        env:
          RUN_TIME_BUDGET_SECONDS: "180"
        run: python -m brain_options.run --retry-stage0 --limit 1 || true

      - name: Generate and evaluate specialized candidates
        timeout-minutes: 25
        env:
          RUN_TIME_BUDGET_SECONDS: "600"
        run: python -m brain_options.run --single-batch --candidates "$CANDIDATES_COUNT" --strategy "$STRATEGY"

      - name: Handle Job Timeout / Cancellation & Emergency Lock Release
        if: cancelled() || failure()
        run: |
          echo "Job cancelled or timed out! Releasing cluster lock and alerting..."
          python -c "
          import os
          from brain_options.config import OptionsConfig
          from brain_options.store.store import OptionsStore
          from brain_options.core.notifier import send_telegram_emergency_alert
          config = OptionsConfig.from_env()
          store = OptionsStore(database_url=config.database_url)
          org_name = os.getenv('GITHUB_REPOSITORY_OWNER', 'local')
          slot_idx = os.getenv('SLOT_IDX', 'unknown')
          try:
              send_telegram_emergency_alert(
                  f'<b>CRITICAL: Job Timeout / Cancellation</b>\n\n'
                  f'GitHub Actions job timed out or was cancelled for org {org_name} (Slot {slot_idx}). Emergency lock release triggered.',
                  context='Job Timeout Cancellation',
                  cooldown_minutes=30,
                  db=store.db,
              )
          except Exception as e:
              print('Failed to send timeout alert:', e)
          if store.db:
              try:
                  with store.db._get_connection() as conn:
                      with conn.cursor() as cur:
                          cur.execute('DELETE FROM cluster_run_lock WHERE org_name = %s;', (org_name,))
                      conn.commit()
                  print('Emergency lock released for org', org_name)
              except Exception as e:
                  print('Failed to clear cluster lock:', e)
          " || true

      - name: Chain Auto-Dispatch Next Discovery Run (24/7 Perpetual Execution)
        if: always() && matrix.slot == 0
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Worker 0 triggering next 4-worker cloud matrix run in chain..."
          sleep 60
          if ! gh workflow run run.yml --ref main; then
            echo "Auto-dispatch chaining failed!"
            python -c "
            from brain_options.config import OptionsConfig
            from brain_options.core.notifier import send_telegram_emergency_alert
            send_telegram_emergency_alert(
                '<b>CRITICAL: Pipeline Chain Trigger Failed</b>\n\n'
                'gh workflow run run.yml failed to dispatch next run in chain. Pipeline may stop self-scheduling.',
                context='Workflow Chain Trigger Failed',
                cooldown_minutes=60,
            )
            " || true
          fi
