name: BRAIN Options Alpha Discovery (Auto Staggered)

on:
  schedule:
    # 48 runs/day across 4 worker orgs (1 run every 30 minutes, 24/7):
    # Org 1 (xtley-alpha-research-01): even hours at :07 (12 runs/day)
    - cron: "7 */2 * * *"
    # Org 2 (xtley-alpha-research-02): even hours at :37 (12 runs/day)
    - cron: "37 */2 * * *"
    # Org 3 (xtley-alpha-research-03): odd hours at :07 (12 runs/day)
    - cron: "7 1-23/2 * * *"
    # Org 4 (xtley-alpha-research-04): odd hours at :37 (12 runs/day)
    - cron: "37 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      candidates:
        description: "Number of candidates to evaluate in this batch"
        required: false
        default: "40"
      archetype:
        description: "Archetype specialization override (e.g. breakeven, skew, term_structure, forward_basis,pcr_flow)"
        required: false
        default: ""
      universe:
        description: "Universe override (e.g. TOP3000, TOP2000, TOP1000, TOP500, TOP200, TOPSP500)"
        required: false
        default: ""

concurrency:
  group: brain-discovery-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  discovery:
    # Only worker orgs run discovery — primary org (Xtley001) is excluded.
    # The cron schedule string comparison was removed (it was fragile and silently skipped runs).
    # Each org now runs on every trigger; archetype specialization is resolved in the Python step.
    if: github.repository_owner != 'Xtley001'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAIN_USERNAME: ${{ secrets.BRAIN_USERNAME }}
      BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAIN_MAX_CONCURRENT_SIMS: "3"
      MAX_CANDIDATES_PER_RUN: ${{ github.event.inputs.candidates || '40' }}
      RUN_TIME_BUDGET_SECONDS: "900"
      STAGE0_MIN_FITNESS: "0.20"
      STAGE0_MIN_SHARPE: "0.35"
      FILTER_MIN_SHARPE: "1.25"
      FILTER_MIN_FITNESS: "1.00"
      FILTER_MAX_TURNOVER: "0.70"
      FILTER_MIN_TURNOVER: "0.01"
      ENABLE_AUTO_SUBMIT: "true"
      DELAY: "1"
      NOTIFY_EVERY_BATCH: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Multiverse Universe & Archetype Specialization
        run: |
          INPUT_ARCH="${{ github.event.inputs.archetype }}"
          INPUT_UNIV="${{ github.event.inputs.universe }}"
          OWNER="${{ github.repository_owner }}"

          # Archetype specialization
          if [ -n "$INPUT_ARCH" ]; then
            TARGET_ARCH="$INPUT_ARCH"
          elif [ "$OWNER" = "xtley-alpha-research-01" ]; then
            TARGET_ARCH="term_structure,skew"
          elif [ "$OWNER" = "xtley-alpha-research-02" ]; then
            TARGET_ARCH="pcr_flow,forward_basis"
          elif [ "$OWNER" = "xtley-alpha-research-03" ]; then
            TARGET_ARCH="breakeven,short_interest"
          elif [ "$OWNER" = "xtley-alpha-research-04" ]; then
            TARGET_ARCH="hybrid_confluence,term_structure,pcr_flow"
          else
            TARGET_ARCH=""
          fi

          # Multiverse Universe specialization
          if [ -n "$INPUT_UNIV" ]; then
            TARGET_UNIV="$INPUT_UNIV"
          elif [ "$OWNER" = "xtley-alpha-research-01" ]; then
            TARGET_UNIV="TOP1000"
          elif [ "$OWNER" = "xtley-alpha-research-02" ]; then
            TARGET_UNIV="TOP2000"
          elif [ "$OWNER" = "xtley-alpha-research-03" ]; then
            TARGET_UNIV="TOP500"
          elif [ "$OWNER" = "xtley-alpha-research-04" ]; then
            TARGET_UNIV="TOPSP500"
          else
            TARGET_UNIV="TOP3000"
          fi

          echo "ARCHETYPE=$TARGET_ARCH" >> $GITHUB_ENV
          echo "UNIVERSE=$TARGET_UNIV" >> $GITHUB_ENV
          echo "Resolved Multiverse Specialization for $OWNER: Universe=$TARGET_UNIV, Archetype=$TARGET_ARCH"

      - name: Salvage high-Sharpe correlated alphas
        run: python -m brain_options.run --decorrelate --limit 1 || true

      - name: Re-optimize Stage 0 passed candidates
        run: python -m brain_options.run --retry-stage0 --limit 1 || true

      - name: Generate and evaluate specialized candidates
        run: python -m brain_options.run --single-batch --candidates ${{ env.MAX_CANDIDATES_PER_RUN }}
