name: Keepalive

# GitHub automatically disables scheduled workflows on a public repo after 60
# days with no repository activity (pushes/commits -- Actions runs themselves
# don't reliably count). Since this pipeline is meant to run unattended
# indefinitely, this job makes one trivial commit a month so the main
# schedule in run.yml never gets silently switched off.

on:
  schedule:
    - cron: "0 0 1 * *"  # 00:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record a heartbeat timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.last-keepalive

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.last-keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive heartbeat"
          git push
