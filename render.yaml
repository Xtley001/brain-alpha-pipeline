services:
  # Cron Job, not a Background Worker: run_worker.py now does one bounded
  # pass (reclaim -> top up queue once -> process a bounded batch of
  # candidates) and exits, instead of running two `while True:` loops
  # forever. See pipeline/run_worker.py's module docstring for the full
  # design, and the refactor summary for the honest speed tradeoffs vs the
  # old always-on worker.
  #
  # NOTE ON COST: as of this writing, Render's "Deploy for Free" free
  # instance type is NOT available for Cron Jobs -- it's limited to Web
  # Services, Static Sites, Postgres, and Key Value (see
  # https://render.com/docs/free). Cron jobs are billed per second of
  # actual run time with a $1/month minimum per cron job service (see
  # https://render.com/docs/cronjobs). This is still much cheaper than the
  # $7/month Background Worker "Starter" plan for a job that only runs a
  # few minutes every 10 minutes, but it is NOT literally free -- verify
  # actual cost against your real per-tick run time in the Render
  # dashboard once a few scheduled runs have completed. See summary for
  # more detail; this correction to the original "free" premise is worth
  # confirming before treating $/month as settled.
  - type: cron
    name: brain-alpha-pipeline
    env: python
    schedule: "*/10 * * * *"  # every 10 minutes, UTC; within the user's stated 10-15 min target -- confirm in the Render dashboard this is the cadence you want before relying on it
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m pipeline.run_worker"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BRAIN_USERNAME
        sync: false
      - key: BRAIN_PASSWORD
        sync: false
      - key: BRAIN_MAX_CONCURRENT_SIMS
        value: "3"
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: QUEUE_TARGET_DEPTH
        value: "75"
      - key: TEMPLATE_TIER_MAX_SHARE
        value: "0.5"
      - key: MAX_CANDIDATES_PER_RUN
        value: "15"
      - key: RUN_TIME_BUDGET_SECONDS
        value: "480"
      - key: STAGE0_MIN_FITNESS
        value: "0.3"
      - key: STAGE0_MIN_SHARPE
        value: "0.5"
      - key: FILTER_MIN_SHARPE
        value: "1.25"
      - key: FILTER_MIN_FITNESS
        value: "1.0"
      - key: FILTER_MAX_TURNOVER
        value: "0.70"
