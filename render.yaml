services:
  # Cron Job, not a Background Worker: run_worker.py now does one bounded
  # pass (reclaim -> top up queue once -> process a bounded batch of
  # candidates) and exits, instead of running two `while True:` loops
  # forever.
  #
  # NOTE ON COST: as of this writing, Render's "Deploy for Free" free
  # instance type is NOT available for Cron Jobs -- it's limited to Web
  # Services, Static Sites, Postgres, and Key Value. Cron jobs are billed
  # per second of actual run time with a $1/month minimum per cron job service.
  - type: cron
    name: brain-options-pipeline
    env: python
    schedule: "*/10 * * * *"  # every 10 minutes, UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m brain_options.run --single-batch"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: BRAIN_USERNAME
        sync: false
      - key: BRAIN_PASSWORD
        sync: false
      - key: BRAIN_MAX_CONCURRENT_SIMS
        value: "3"
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY_3
        sync: false
      - key: OPENROUTER_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: QUEUE_TARGET_DEPTH
        value: "75"
      - key: TEMPLATE_TIER_MAX_SHARE
        value: "0.5"
      - key: MAX_CANDIDATES_PER_RUN
        value: "15"
      - key: RUN_TIME_BUDGET_SECONDS
        value: "480"
      - key: STAGE0_MIN_FITNESS
        value: "0.20"
      - key: STAGE0_MIN_SHARPE
        value: "0.35"
      - key: FILTER_MIN_SHARPE
        value: "1.25"
      - key: FILTER_MIN_FITNESS
        value: "1.0"
      - key: FILTER_MAX_TURNOVER
        value: "0.70"
