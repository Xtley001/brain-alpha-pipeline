services:
  - type: web
    name: brain-alpha-pipeline
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install fastapi uvicorn"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: BRAIN_USERNAME
        sync: false
      - key: BRAIN_PASSWORD
        sync: false
      - key: BRAIN_MAX_CONCURRENT_SIMS
        value: "3"
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY_3
        sync: false
      - key: OPENROUTER_API_KEY_4
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ENABLE_AUTO_SUBMIT
        value: "true"
      - key: DRIP_MAX_DAILY
        value: "3"
      - key: DRIP_MIN_INTERVAL_HOURS
        value: "4.0"
      - key: UNIVERSE
        value: "TOP3000"
      - key: DELAY
        value: "1"
      - key: MAX_CANDIDATES_PER_RUN
        value: "15"
      - key: STAGE0_MIN_FITNESS
        value: "0.20"
      - key: STAGE0_MIN_SHARPE
        value: "0.35"
      - key: FILTER_MIN_SHARPE
        value: "1.25"
      - key: FILTER_MIN_FITNESS
        value: "1.00"
      - key: FILTER_MAX_TURNOVER
        value: "0.70"
      - key: FILTER_MIN_TURNOVER
        value: "0.01"
